<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,"><title>NNN Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--line:#262626;--gold:#e8b923;--txt:#f5f5f5;--muted:#a3a3a3;--red:#ff2d3a;--green:#22c55e;--surf:#141414;--surf2:#1c1c1c;--gb:#e8b92347}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#e8b9231a,transparent),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}
h1,h2{font-family:Oswald,sans-serif;margin:0;color:var(--gold);text-transform:uppercase}h1{letter-spacing:.08em}
h2{font-size:18px;margin:28px 0 10px;letter-spacing:.1em;font-weight:600;border-left:3px solid var(--gold);padding-left:10px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.top{background:linear-gradient(180deg,#0c0c0c,#050505);border-bottom:1px solid var(--gb);box-shadow:0 12px 40px #0000008c;position:relative;padding:18px 0}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#e8b923,transparent)}
.muted{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.pill{background:var(--surf2);color:#d4d4d4;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font:600 13px Inter,system-ui;cursor:pointer;transition:all .15s}
.pill:hover{border-color:var(--gold);box-shadow:0 0 18px #e8b92355;transform:translateY(-1px)}
.pill.on{background:linear-gradient(180deg,#f5c518,#e8b923);color:#050505;border-color:#e8b923;box-shadow:0 0 18px #e8b923d9,0 4px 12px #00000080}
@media(max-width:600px){.pill{padding:6px 12px;font-size:12px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card,.chartbox,#gate form{background:linear-gradient(180deg,#1c1c1c,#141414);border:1px solid var(--gb);border-radius:1rem;padding:14px;transition:transform .2s,box-shadow .2s}
.card:hover,.chartbox:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 14px 36px #00000073,0 0 0 1px #e8b923}
.card .l{font:700 11px Inter;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.card .v{font:700 26px Oswald;margin-top:4px}.card.hero .v{font-size:34px}
.card .s{font-size:12px;color:var(--muted);margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--gb);border-radius:1rem;overflow:hidden;color:var(--txt)}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{background:#0c0c0c;color:var(--gold);text-transform:uppercase;font:600 11px Inter;letter-spacing:.12em;border-bottom:1px solid var(--gold)}
td{border-bottom:1px solid #202020}tr:nth-child(even) td{background:#0c0c0c66}tr:hover td{background:#e8b92314}tr.ft td{font-weight:700;background:#0c0c0c;border-top:1px solid var(--gb)}
tr.dim td{color:var(--muted)}th.t,td.t{text-align:left!important}
.scroll{overflow-x:auto}.neg{color:var(--red)!important}.pos{color:var(--green)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chartbox svg{width:100%;height:auto;display:block}.chartbox text{fill:#a3a3a3;font:11px Inter}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9}
#gate form{padding:28px;text-align:center}
#gate input{font:18px Inter;padding:8px 12px;border:1px solid var(--gb);border-radius:8px;width:180px;text-align:center;background:#0c0c0c;color:var(--txt)}
#gate button{margin-left:6px;font:700 15px Inter;padding:9px 16px;border:0;border-radius:999px;background:var(--gold);color:#050505;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fx-in{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes shim{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shim{background:linear-gradient(90deg,#f5c518 0%,#fff3b0 45%,#e8b923 55%,#f5c518 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 3.5s linear infinite}
.shim.neg{background:none;-webkit-text-fill-color:var(--red);animation:none}
.bar{height:6px;background:#262626;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.chartbox rect{transition:y .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){.fx-in{animation:none;opacity:1}.shim{animation:none}.bar i,.chartbox rect{transition:none}.card:hover,.chartbox:hover,.pill:hover{transform:none}}

tr.cur td{background:#e8b92326!important;font-weight:700}
.info{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;margin:2px 0 14px}.info b{color:var(--txt);font-weight:600}
.card .v.sm{font-size:20px}
</style></head><body>
<div id="gate"><form onsubmit="go(event)"><h1>NNN Tracker</h1><p class="muted">Enter password</p><input id="pw" type="password" autofocus><button>Open</button><div id="err" class="neg"></div></form></div>
<div class="top"><div class="wrap"><h1>NNN Tracker</h1><div class="muted">Parma Gas Station · Popeyes Orange City · <span id="gen"></span></div></div></div>
<div class="wrap" id="app" style="display:none">
<div class="pills" id="tabs" style="margin-top:16px"><button class="pill" data-t="all">All</button><button class="pill" data-t="parma">Parma Gas Station</button><button class="pill" data-t="popeyes">Popeyes Orange City</button></div>
<section data-s="A"><div class="cards" id="hero"></div><h2>Properties</h2><div class="cards" id="pcards"></div>
<div class="grid2"><div><h2>Rent by Year</h2><div class="chartbox" id="cHist"></div></div><div><h2>Contract Rent to Lease End</h2><div class="chartbox" id="cProj"></div></div></div>
<h2>Summary</h2><div class="scroll" id="tSum"></div>
<h2>Rent, Mortgage &amp; Net by Year</h2><div class="scroll" id="tHist"></div>
<h2>Contract Rent, Mortgage &amp; Net to Lease End</h2><div class="scroll" id="tProj"></div>
<h2>Deposits Received</h2><div class="scroll" id="tDepA"></div></section>
<section data-s="P"><div class="info" id="pinfo"></div><div class="cards" id="pc"></div>
<h2>Escalation Schedule</h2><div class="chartbox" id="cSch"></div><div class="scroll" style="margin-top:12px" id="tSch"></div>
<div class="grid2"><div><h2>Rent by Year</h2><div class="scroll" id="tPY"></div></div><div><h2>Deposits Received</h2><div class="scroll" id="tDep"></div></div></div></section>
<br></div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const e=await (await fetch('data.enc.json',{cache:'no-store'})).json();
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))));}
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COL={parma:'#e8b923',popeyes:'#f97316'};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const r2=v=>Math.round(v*100)/100;
const $=v=>v==null||!isFinite(v)?'—':(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const $k=v=>(v<0?'-':'')+'$'+(Math.abs(v)>=1e6?(Math.abs(v)/1e6).toFixed(2)+'M':Math.abs(v)>=1e3?(Math.abs(v)/1e3).toFixed(0)+'K':Math.abs(v).toFixed(0));
const sg=v=>v==null?'':v>0?'pos':v<0?'neg':'';
const M=v=>({v:$(v),c:sg(v),d:v});
const fd=s=>{if(!s)return '—';const [y,m,d]=s.split('-').map(Number);return `${MO[m-1]} ${d}, ${y}`};
const D8=s=>({v:fd(s),d:s?Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)):null});
const N=(v,suf)=>({v:v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:2})+(suf||''),d:v});
const cell=c=>{if(c&&typeof c=='object')return `<td class="${c.c||''}"${c.d!=null&&isFinite(c.d)?` data-v="${c.d}"`:''}>${c.v}</td>`;return `<td>${c??''}</td>`};
function tbl(id,h,rows,foot,rc){const tx=h.map((_,j)=>rows.length&&rows.every(r=>!(r[j]&&typeof r[j]=='object')));const ce=(c,j)=>tx[j]?`<td class="t">${c??''}</td>`:cell(c);document.getElementById(id).innerHTML='<table><thead><tr>'+h.map((x,j)=>`<th class="${tx[j]?'t':''}">${x}</th>`).join('')+'</tr></thead><tbody>'+rows.map((r,i)=>`<tr class="${rc?rc(i):''}">`+r.map(ce).join('')+'</tr>').join('')+'</tbody>'+(foot?'<tfoot><tr class="ft">'+foot.map(ce).join('')+'</tr></tfoot>':'')+'</table>';}
const sum=a=>r2(a.reduce((x,y)=>x+(y||0),0));
let D,tab;
function stacked(id,groups,keys,colors,names){const W=900,Hh=260,P=46;let mx=0,mn=0;
 groups.forEach(g=>{let p=0,n=0;keys.forEach(k=>{const v=g.vals[k]||0;v>0?p+=v:n+=v});g.p=p;g.n=n;mx=Math.max(mx,p);mn=Math.min(mn,n)});
 if(mx===mn)mx=1;const rng=mx-mn,s=(Hh-50)/rng,z=26+mx*s,step=(W-P-20)/groups.length,bw=Math.min(60,step*0.62);
 let g=`<line x1="${P}" x2="${W}" y1="${z}" y2="${z}" stroke="#525252"/>`;
 [mx,mx/2].forEach(v=>{const y=z-v*s;g+=`<text x="${P-6}" y="${y+4}" text-anchor="end">${$k(v)}</text><line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="#1f1f1f"/>`});
 const lab=groups.length>12;
 groups.forEach((gr,i)=>{const x=P+10+i*step+(step-bw)/2;let up=z;
  keys.forEach(k=>{const v=gr.vals[k]||0;if(v<=0)return;const h=v*s;up-=h;
   g+=`<rect x="${x}" width="${bw}" y="${z}" height="0" data-y="${up}" data-h="${h}" fill="${colors[k]}" rx="2"><title>${gr.label} · ${names[k]}: ${$(v)}</title></rect>`});
  g+=`<text x="${x+bw/2}" y="${Hh+12}" text-anchor="middle">${lab?"'"+String(gr.label).slice(2,4):gr.label}</text>`;
  if(!lab)g+=`<text x="${x+bw/2}" y="${up-5}" text-anchor="middle" style="fill:#f5f5f5;font-weight:700">${gr.p?$k(gr.p):''}</text>`});
 document.getElementById(id).innerHTML=`<div class="muted">${keys.map(k=>`<span class="lg" style="background:${colors[k]}"></span>${names[k]}`).join('')}</div><svg viewBox="0 0 ${W} ${Hh+20}">${g}</svg>`;
 setTimeout(()=>document.querySelectorAll('#'+id+' rect').forEach(r=>{r.setAttribute('y',r.dataset.y);r.setAttribute('height',r.dataset.h)}),RM?0:250);}
function card(l,v,s,extra,hero,raw){return `<div class="card${hero?' hero':''}"><div class="l">${l}</div><div class="v ${raw?'sm':sg(v)}">${raw?v:$(v)}</div>${s?`<div class="s">${s}</div>`:''}${extra||''}</div>`}
function bar(p,c){return `<div class="bar"><i data-w="${Math.max(0,Math.min(100,p))}" style="background:${c}"></i></div>`}
const nxtTxt=p=>p.next?`+${p.pct}% on ${fd(p.next.date)} → ${$(p.next.monthly)}/mo`:'Final lease year';
function all(){const K=D.keys,P=D.props,T=D.tot,nm=Object.fromEntries(K.map(k=>[k,P[k].name]));
 const firstDep=K.map(k=>P[k].depFirst).filter(Boolean).sort()[0];
 document.getElementById('hero').innerHTML=card('Combined monthly rent',T.monthly,`${$(T.annual)} per year`,'',1)+card('Combined annual rent',T.annual,`${T.yoc}% yield on ${$(T.price)} cost`,'',1)
  +card('Mortgage / debt service',-T.mort,`${$(-T.mortAnn)} per year · Popeyes only`)+card('Net cash flow / month',T.net,`${$(T.netAnn)} per year after mortgage`,'',1)
  +card('Deposits received',T.received,'Since '+fd(firstDep))+card('Remaining lease value',T.remaining,'Contract rent from next month to lease end')+card('Rent by year, all years',T.allIncome,D.years[0]+'–'+D.years[D.years.length-1]);
 document.getElementById('pcards').innerHTML=K.map(k=>{const p=P[k];return card(`<span class="dot" style="background:${COL[k]}"></span>${p.name}`,p.monthly,`${p.mort?`Mortgage ${$(-p.mort)}/mo · Net ${$(p.net)}/mo (${$(p.netAnn)}/yr)`:'No debt · Net = rent'} · ${$(p.annual)}/yr gross · ${p.yearsLeft} yrs left · ${nxtTxt(p)}`,bar(p.elapsed,COL[k]))}).join('');
 stacked('cHist',D.years.map(Y=>({label:Y,vals:Object.fromEntries(K.map(k=>[k,P[k].byYear[Y]]))})),K,COL,nm);
 stacked('cProj',D.pyears.map(Y=>({label:Y,vals:Object.fromEntries(K.map(k=>[k,P[k].contractYear[Y]]))})),K,COL,nm);
 tbl('tSum',['Property','Tenant','Monthly rent','Mortgage / mo','Net cash flow / mo','Annual rent','Mortgage / yr','Net cash flow / yr','Escalation','Next escalation','Next monthly rent','Lease end','Years left','Deposits received','Remaining lease value'],
  K.map(k=>{const p=P[k];return [`<span class="dot" style="background:${COL[k]}"></span>${p.name}`,p.tenant,M(p.monthly),M(-p.mort),M(p.net),M(p.annual),M(-p.mortAnn),M(p.netAnn),{v:p.pct+'% every '+p.esc.replace(/^every /i,''),d:p.pct},D8(p.next&&p.next.date),M(p.next&&p.next.monthly),D8(p.leaseEnd),N(p.yearsLeft),M(p.received),M(p.remaining)]}),
  ['TOTAL','',M(T.monthly),M(-T.mort),M(T.net),M(T.annual),M(-T.mortAnn),M(T.netAnn),'','—','—','—','',M(T.received),M(T.remaining)]);
 ytab('tHist',D.years,'byYear','debtYear','netYear');ytab('tProj',D.pyears,'contractYear','contractDebt','contractNet');
 const dep=K.flatMap(k=>P[k].deps.map(r=>[D8(r[0]),P[k].name,r[1],M(r[2])])).sort((a,b)=>b[0].d-a[0].d);
 tbl('tDepA',['Date','Property','Payer','Amount'],dep,['TOTAL','','',M(T.received)]);}
function ytab(id,Ys,G,Dk,Nk){const K=D.keys,P=D.props,h=['Year'];K.forEach(k=>{h.push(P[k].short+' rent');if(P[k].mort)h.push(P[k].short+' mortgage',P[k].short+' net')});h.push('Total rent','Total mortgage','Total net cash flow');
 const row=(lab,g,dd,n)=>{const r=[lab];let tg=0,td=0;K.forEach(k=>{r.push(M(g(k)));if(P[k].mort)r.push(M(-(dd(k)||0)),M(n(k)));tg+=g(k)||0;td+=dd(k)||0});r.push(M(r2(tg)),M(-r2(td)),M(r2(tg-td)));return r};
 const S=(k,f)=>sum(Object.values(P[k][f]));
 tbl(id,h,Ys.map(Y=>row(Y,k=>P[k][G][Y],k=>P[k][Dk][Y],k=>P[k][Nk][Y])),row('TOTAL',k=>S(k,G),k=>S(k,Dk),k=>S(k,Nk)));}
function prop(k){const p=D.props[k];
 document.getElementById('pinfo').innerHTML=`<span><b>${p.addr}</b></span><span>Tenant <b>${p.tenant}</b></span><span>Lease <b>${fd(p.leaseStart)} – ${fd(p.leaseEnd)}</b></span><span>Purchased <b>${fd(p.acq)}</b></span>`;
 document.getElementById('pc').innerHTML=card('Monthly rent',p.monthly,`${p.pct}% increase every ${p.esc.replace(/^every /i,'')}`,'',1)+card('Annual rent',p.annual,`${p.yoc}% yield on ${$(p.price)} cost`,'',1)
  +card('Mortgage / debt service',p.mort?-p.mort:0,p.mort?`${$(-p.mortAnn)} per year · flat payment`:'No debt on this property')+card('Net cash flow / month',p.net,`${$(p.netAnn)} per year after mortgage`,'',1)
  +card('Next escalation',p.next?p.next.monthly:null,p.next?`${fd(p.next.date)} · +${$(p.next.inc)}/mo · +${$(p.next.incAnn)}/yr`:'')
  +card('Lease years remaining',`${p.yearsLeft}`,`Ends ${fd(p.leaseEnd)} · ${p.remMonths} rent months left`,bar(p.elapsed,COL[k]),0,1)
  +card('Deposits received',p.received,'Since '+fd(p.depFirst))+card('Remaining lease value',p.remaining,'Contract rent from next month to lease end');
 const S=p.sched,lyr=k=='popeyes'?'Lease year':'Year';
 stacked('cSch',S.map(r=>({label:r[1].slice(0,4),vals:{[k]:r[3]}})),[k],COL,{[k]:'Annual rent'});
 tbl('tSch',[lyr,'Effective','Monthly rent','Mortgage / mo','Net / mo','Annual rent','Annual increase','Annual mortgage','Annual net cash flow'],S.map(r=>[{v:r[0],d:Date.parse(r[1])},D8(r[1]),M(r[2]),M(r[5]?-p.mort:0),M(r[5]?r2(r[2]-p.mort):r[2]),M(r[3]),M(r[4]),M(-r[5]),M(r[6])]),['TOTAL','—','','','',M(sum(S.map(r=>r[3]))),'',M(-sum(S.map(r=>r[5]))),M(sum(S.map(r=>r[6])))],i=>i==p.curIdx?'cur':i<p.curIdx?'dim':'');
 const Y=Object.keys(p.byYear);tbl('tPY',['Year','Rent','Mortgage','Net cash flow'],Y.map(y=>[y,M(p.byYear[y]),M(-p.debtYear[y]),M(p.netYear[y])]),['TOTAL',M(p.allIncome),M(-p.allDebt),M(p.allNet)]);
 tbl('tDep',['Date','Payer','Amount'],p.deps.slice().reverse().map(r=>[D8(r[0]),r[1],M(r[2])]),['TOTAL','',M(p.received)]);}
function countUp(el){const t=el.textContent.trim();const m=t.match(/^(-?\$?)([\d,]+(?:\.\d+)?)(%|x)?$/);if(!m||RM)return;const fin=parseFloat(m[2].replace(/,/g,''));const dec=(m[2].split('.')[1]||'').length;const fmt=v=>m[1]+v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+(m[3]||'');
 const t0=performance.now();el.textContent=fmt(0);(function f(n){const p=Math.min(1,(n-t0)/1200),e=1-Math.pow(1-p,3);el.textContent=p<1?fmt(fin*e):t;if(p<1)requestAnimationFrame(f)})(t0);}
function fx(){const vis=[...document.querySelectorAll('#app section')].filter(s=>s.style.display!='none');
 vis.forEach(s=>s.querySelectorAll('h2,.scroll,.card,.chartbox,.info').forEach((e,i)=>{e.classList.remove('fx-in');void e.offsetWidth;e.classList.add('fx-in');e.style.animationDelay=Math.min(i*45,1400)+'ms'}));
 vis.forEach(s=>s.querySelectorAll('.card.hero .v').forEach(e=>e.classList.add('shim')));
 vis.forEach(s=>s.querySelectorAll('td:not(.t),.card .v').forEach(e=>{if(e.children.length==0)countUp(e)}));
 setTimeout(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),RM?0:300);}
function view(t){tab=t;localStorage.nnntab=t;document.querySelectorAll('#tabs .pill').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 const s=t=='all'?'A':'P';document.querySelectorAll('section[data-s]').forEach(x=>x.style.display=x.dataset.s===s?'':'none');
 if(t=='all')all();else prop(t);fx();}
document.addEventListener('click',e=>{const b=e.target.closest('#tabs .pill');if(b)view(b.dataset.t)});
async function go(e){e.preventDefault();try{const pw=document.getElementById('pw').value;D=await decrypt(pw);sessionStorage.nnnpw=pw;}catch(x){document.getElementById('err').textContent='Wrong password';return;}
 document.getElementById('gate').remove();document.getElementById('app').style.display='';document.getElementById('gen').textContent='Updated '+D.generated;
 let t=localStorage.nnntab||'all';if(!document.querySelector(`#tabs [data-t="${t}"]`))t='all';view(t);}
if(sessionStorage.nnnpw){document.getElementById('pw').value=sessionStorage.nnnpw;go(new Event('submit'));}
</script><!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};
    var t=s.replace(/[$,%x×\s]|USD/gi,'').replace(/^\+/,'').replace(/[−–]/g,'-');
    var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
    var mult=1;if((m=t.match(/^(-?[\d.]+)([KMB])$/i))){t=m[1];mult={k:1e3,m:1e6,b:1e9}[m[2].toLowerCase()];}
    if(/^-?\d*\.?\d+$/.test(t))return {n:parseFloat(t)*mult*(neg?-1:1)};
    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();

</script><!--SORTABLE-END-->
